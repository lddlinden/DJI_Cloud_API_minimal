<!DOCTYPE html>
<html>
  <head>
    <title>Login page</title>
    <style>
      .button-row {
        display: flex;
        justify-content: space-between;
      }

      button {
        flex: 1;
        margin: 0 5px;
      }
    </style>
  </head>
  <body>
    <h1>DJI Cloud API test</h1>

    <div class="button-row">
      <button id="login-button">Login</button>
      <button id="logout-button">Logout</button>
      <button id="raport-button">Raport</button>
    </div>
    <ul id="logs"></ul>
    <script>
      const APP_ID = "{{DJI_APP_ID}}";
      const LICENSE = "{{DJI_LICENSE}}";
      const APP_KEY = "{{DJI_APP_KEY}}";
      var fieldList = document.getElementById("logs");
      var log = function (msg) {
        var li = document.createElement("li");
        li.innerText = msg;
        fieldList.appendChild(li);
      };
      var reg_calback = function () {
        log("Callback called🎉, arguments:" + Array.from(arguments));
      };
      var loginButton = document.getElementById("login-button");
      loginButton.addEventListener("click", function () {
        log("login");
        var token = window.djiBridge.platformVerifyLicense(
          APP_ID,
          APP_KEY,
          LICENSE
        );
        log("platform is verified: " + window.djiBridge.platformIsVerified());

        var register_params = JSON.stringify({
          host: "tcp://hostnamehere:1883",
          connectCallback: "reg_calback",
          username: "userloginhere",
          password: "userpasswordhere",
        });
        
        log("Params being loaded: " + register_params);
        var loadResult = window.djiBridge.platformLoadComponent("thing", register_params);
        log("Load Component result: " + loadResult);
        log("State after load: " + window.djiBridge.thingGetConnectState());
        
        log("Attempting thingConnect with user: userloginhere");
        var connectResult = window.djiBridge.thingConnect("userloginhere", "userpasswordhere", "reg_calback");
        log("thingConnect result: " + connectResult);

        log("Thing Connect state: " + window.djiBridge.thingGetConnectState());
        // log("TODO here I am supposed to ask about login, password, gateway");
      });

      var logoutButton = document.getElementById("logout-button");
      logoutButton.addEventListener("click", function () {
        log(
          "unregistering: " + window.djiBridge.platformUnloadComponent("thing")
        );
      });

      document
        .getElementById("raport-button")
        .addEventListener("click", function () {
          log(
            "Statusy platformIsComponentLoaded: " +
              window.djiBridge.platformIsComponentLoaded("thing") +
              "\nthing state" +
              window.djiBridge.thingGetConnectState()
          );
        });

      log("platform is verified: " + window.djiBridge.platformIsVerified());
    </script>
  </body>
</html>
